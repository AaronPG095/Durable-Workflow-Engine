services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dwe
      POSTGRES_PASSWORD: dwe
      POSTGRES_DB: dwe
    ports:
      - "${DWE_PG_PORT:-5433}:5432"
    volumes:
      - dwe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwe -d dwe"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: ./engine
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dwe:dwe@postgres:5432/dwe?sslmode=disable
      DWE_QUEUE: default
      DWE_CONCURRENCY: "4"
      DWE_LEASE_TTL: 15s
      DWE_REAPER_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dwe_pgdata:
